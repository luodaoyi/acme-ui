name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          fi
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" \
              -o "dist/acme-ui-linux-${arch}" ./cmd/acme-ui
          done
          cp scripts/acme-ui.sh dist/acme-ui.sh
          chmod +x dist/acme-ui.sh dist/acme-ui-linux-*
          (
            cd dist
            sha256sum acme-ui-linux-* acme-ui.sh > checksums.txt
          )
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${VERSION}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes "Linux binaries and one-shot launcher for acme-ui."
